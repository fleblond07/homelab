---
name: François Rieux tests

on:
  pull_request:
    paths:
      - roles/forgejo/**
      - roles/francois_rieux/**
      - playbooks/forgejo.yml
      - playbooks/francois_rieux.yml
      - tests/test_francois_rieux.py
      - requirements-dev.txt
      - .github/workflows/francois-rieux-tests.yml
  push:
    paths:
      - roles/forgejo/**
      - roles/francois_rieux/**
      - playbooks/forgejo.yml
      - playbooks/francois_rieux.yml
      - tests/test_francois_rieux.py
      - requirements-dev.txt
      - .github/workflows/francois-rieux-tests.yml

permissions:
  contents: read

jobs:
  francois-rieux-tests:
    name: François Rieux template tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test Forgejo and site templates
        run: python -m unittest discover -s tests -p test_francois_rieux.py -v
