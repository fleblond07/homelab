---
name: Dashboard tests

on:
  pull_request:
    paths:
      - roles/homepage/**
      - playbooks/homepage.yml
      - tests/test_homepage.py
      - requirements-dev.txt
      - .github/workflows/dashboard-tests.yml
  push:
    paths:
      - roles/homepage/**
      - playbooks/homepage.yml
      - tests/test_homepage.py
      - requirements-dev.txt
      - .github/workflows/dashboard-tests.yml

permissions:
  contents: read

jobs:
  dashboard-tests:
    name: Dashboard template tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test dashboard templates
        run: python -m unittest discover -s tests -p test_homepage.py -v
