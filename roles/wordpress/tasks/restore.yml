---
- name: Validate Backblaze restore settings
  ansible.builtin.assert:
    that:
      - (wordpress_site.restore | default({})).bucket | default(wordpress_s3_bucket) | length > 0
      - wordpress_s3_endpoint_url is match('^https://[^/]+/?$')
      - wordpress_s3_access_key_id | default('') | length > 0
      - wordpress_s3_secret_access_key | default('') | length > 0
      - (wordpress_site.restore | default({})).encryption_passphrase | default(wordpress_backup_password | default('')) | length > 0
      - wordpress_site.name is match('^[a-zA-Z0-9_-]+$')
      - wordpress_site.database_name is match('^[a-zA-Z0-9_-]+$')
      - (wordpress_site.restore | default({})).date | default(wordpress_restore_date) is match('^(latest|[0-9]{4}-[0-9]{2}-[0-9]{2})$')
    fail_msg: Restore requires the Backblaze backup credentials and encryption password.
  no_log: true

- name: Restore the selected WordPress archives
  block:
    - name: Store temporary backup passphrase
      ansible.builtin.copy:
        dest: "{{ wordpress_secret_root }}/{{ wordpress_site.name }}-backup-passphrase"
        owner: root
        group: root
        mode: "0600"
        content: "{{ (wordpress_site.restore | default({})).encryption_passphrase | default(wordpress_backup_password | default('')) }}\n"
      no_log: true

    - name: Install WordPress archive restore script
      ansible.builtin.template:
        src: restore.sh.j2
        dest: "{{ wordpress_restore_root }}/{{ wordpress_site.name }}/restore.sh"
        owner: root
        group: root
        mode: "0700"
        validate: /bin/bash -n %s

    - name: Download and restore Backblaze archives
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ wordpress_restore_root }}/{{ wordpress_site.name }}/restore.sh"
      environment:
        AWS_ACCESS_KEY_ID: "{{ wordpress_s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ wordpress_s3_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ wordpress_s3_region | default('') }}"
      register: wordpress_restore_result
      changed_when: "'Restored WordPress files and database.' in wordpress_restore_result.stdout"
      no_log: true

  always:
    - name: Remove temporary backup passphrase
      ansible.builtin.file:
        path: "{{ wordpress_secret_root }}/{{ wordpress_site.name }}-backup-passphrase"
        state: absent
      no_log: true
