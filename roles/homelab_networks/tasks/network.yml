---
- name: Inspect application network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ homelab_networks_name }}"]
  register: homelab_networks_inspect
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create application network
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'network', 'create']
         + (['--internal'] if homelab_networks_internal | default(false) | bool else [])
         + [homelab_networks_name] }}
  when: homelab_networks_inspect.rc != 0
  changed_when: true

- name: Validate existing network isolation
  ansible.builtin.assert:
    that:
      - (homelab_networks_inspect.stdout | from_json | first).Internal == (homelab_networks_internal | default(false) | bool)
    fail_msg: "Existing Docker network has unexpected isolation settings; inspect it before changing attached services."
  when: homelab_networks_inspect.rc == 0
