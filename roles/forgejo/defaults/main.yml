---
forgejo_enabled: false
forgejo_image: codeberg.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
forgejo_container_name: homelab-forgejo
forgejo_project_name: homelab-forgejo
forgejo_restart_policy: unless-stopped
forgejo_storage_root: /srv/homelab
forgejo_compose_dir: "{{ forgejo_storage_root }}/compose/forgejo"
forgejo_data_dir: "{{ forgejo_storage_root }}/data/forgejo"
forgejo_uid: "1000"
forgejo_gid: "1000"
forgejo_network: homelab-forgejo
forgejo_port: 3000
forgejo_host: git.francoisrieux.com
forgejo_root_url: "https://{{ forgejo_host }}/"
forgejo_app_name: Forgejo
forgejo_timezone: "{{ timezone | default('UTC') }}"
forgejo_require_signin_view: false
forgejo_cors_allowed_origins:
  - https://francoisrieux.com
  - https://www.francoisrieux.com
forgejo_log_level: Warn
forgejo_wait_timeout: 180
