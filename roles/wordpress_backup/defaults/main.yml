---
# Enable and supply credentials in Ansible Vault.
wordpress_backup_enabled: false
# Shared with the wordpress role so backup and restore use the same settings.
wordpress_s3_cli: aws  # noqa: var-naming[no-role-prefix]
wordpress_s3_endpoint_url: ""  # noqa: var-naming[no-role-prefix]
wordpress_s3_region: ""  # noqa: var-naming[no-role-prefix]
wordpress_s3_access_key_id: ""  # noqa: var-naming[no-role-prefix]
wordpress_s3_secret_access_key: ""  # noqa: var-naming[no-role-prefix]
# Fallback; a site's restore.bucket takes precedence.
wordpress_s3_bucket: ""  # noqa: var-naming[no-role-prefix]
wordpress_s3_prefix: wordpress  # noqa: var-naming[no-role-prefix]
wordpress_backup_password: ""
wordpress_backup_config_dir: /etc/homelab-wordpress-backup
wordpress_backup_staging_dir: /srv/homelab/backups-staging/wordpress-backup
wordpress_backup_database_calendar: "*-*-* 03:00:00"
wordpress_backup_files_calendar: "Sun *-*-* 04:00:00"
# Number of successful archives retained per site and backup type.
wordpress_backup_database_keep: 7
wordpress_backup_files_keep: 4
wordpress_backup_data_root: "{{ wordpress_data_root | default('/srv/homelab/data/wordpress') }}"
wordpress_backup_config_root: "{{ wordpress_config_root | default('/srv/homelab/config/wordpress') }}"
wordpress_backup_database_container: "{{ mariadb_name | default('homelab-mariadb') }}"
