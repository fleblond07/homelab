---
- name: Configure WordPress backups when enabled
  when: wordpress_backup_enabled | bool
  block:
    - name: Validate Backblaze configuration
      ansible.builtin.assert:
        that:
          - wordpress_s3_endpoint_url is match('^https://[^/]+/?$')
          - wordpress_s3_prefix is match('^[a-zA-Z0-9_/-]*$')
          - wordpress_s3_region | length > 0
          - wordpress_s3_access_key_id | length > 0
          - wordpress_s3_secret_access_key | length > 0
          - wordpress_sites | default([]) | length > 0
          - wordpress_sites | map(attribute='name') | unique | length == wordpress_sites | length
          - wordpress_backup_database_keep | string is match('^[1-9][0-9]*$')
          - wordpress_backup_files_keep | string is match('^[1-9][0-9]*$')
        fail_msg: Supply the WordPress backup settings and credentials described in docs/backups.md.
      no_log: true

    - name: Validate WordPress backup site identifiers
      ansible.builtin.assert:
        that:
          - (item.restore | default({})).bucket | default(wordpress_s3_bucket) is match('^[a-zA-Z0-9][a-zA-Z0-9.-]+[a-zA-Z0-9]$')
          - (item.restore | default({})).encryption_passphrase | default(wordpress_backup_password) | length >= 20
          - item.name is match('^[a-zA-Z0-9_-]+$')
          - item.database_name is match('^[a-zA-Z0-9_-]+$')
          - item.container_name | default('homelab-wordpress-' ~ item.name) is match('^[a-zA-Z0-9_-]+$')
      loop: "{{ wordpress_sites }}"
      no_log: true

    - name: Install backup tools
      ansible.builtin.apt:
        name: [awscli, gpg, gzip, tar, util-linux, python3, python3-botocore]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create private backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ wordpress_backup_config_dir }}"
        - "{{ wordpress_backup_staging_dir }}"

    - name: Store archive encryption password
      ansible.builtin.copy:
        content: "{{ (item.restore | default({})).encryption_passphrase | default(wordpress_backup_password) }}\n"
        dest: "{{ wordpress_backup_config_dir }}/{{ item.name }}-password"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      loop: "{{ wordpress_sites }}"

    - name: Store Backblaze environment
      ansible.builtin.template:
        src: environment.j2
        dest: "{{ wordpress_backup_config_dir }}/environment"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install backup script
      ansible.builtin.template:
        src: backup.sh.j2
        dest: /usr/local/sbin/homelab-wordpress-backup
        owner: root
        group: root
        mode: "0700"
        validate: /bin/bash -n %s

    - name: Install backup systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - homelab-wordpress-backup-database.service
        - homelab-wordpress-backup-database.timer
        - homelab-wordpress-backup-files.service
        - homelab-wordpress-backup-files.timer
      register: wordpress_backup_units

    - name: Enable backup timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: "{{ 'restarted' if wordpress_backup_units.changed else 'started' }}"
        daemon_reload: true
      loop:
        - homelab-wordpress-backup-database.timer
        - homelab-wordpress-backup-files.timer

- name: Disable backup timers when backups are disabled
  when: not (wordpress_backup_enabled | bool)
  block:
    - name: Find installed backup timers
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - homelab-wordpress-backup-database.timer
        - homelab-wordpress-backup-files.timer
      register: wordpress_backup_timer_files

    - name: Stop disabled backup timers
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        enabled: false
        state: stopped
      loop: "{{ wordpress_backup_timer_files.results }}"
      when: item.stat.exists
