---
- name: Ensure MariaDB host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ mariadb_compose_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mariadb_config_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ mariadb_data_dir }}"
      owner: "{{ mariadb_uid }}"
      group: "{{ mariadb_gid }}"
      mode: "0750"
    - path: "{{ mariadb_log_dir }}"
      owner: "{{ mariadb_uid }}"
      group: "{{ mariadb_gid }}"
      mode: "0750"
    - path: "{{ mariadb_secret_dir }}"
      owner: root
      group: root
      mode: "0700"

- name: Check for existing MariaDB root password
  ansible.builtin.stat:
    path: "{{ mariadb_root_password_file }}"
  register: mariadb_root_password_stat
  no_log: true

- name: Generate MariaDB root password
  ansible.builtin.copy:
    dest: "{{ mariadb_root_password_file }}"
    owner: root
    group: root
    mode: "0600"
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}\n"
  when: not mariadb_root_password_stat.stat.exists
  no_log: true

- name: Configure MariaDB server settings
  ansible.builtin.template:
    src: server.cnf.j2
    dest: "{{ mariadb_config_dir }}/server.cnf"
    owner: root
    group: root
    mode: "0644"
  register: mariadb_server_config

- name: Install MariaDB Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ mariadb_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Configure MariaDB slow-query log retention
  ansible.builtin.template:
    src: logrotate-mariadb.j2
    dest: /etc/logrotate.d/homelab-mariadb
    owner: root
    group: root
    mode: "0644"

- name: Start MariaDB with Docker Compose
  ansible.builtin.command:
    cmd: docker compose -f {{ mariadb_compose_dir }}/compose.yml up -d
  register: mariadb_compose_up
  changed_when: >-
    'Created' in (mariadb_compose_up.stdout + mariadb_compose_up.stderr) or
    'Recreated' in (mariadb_compose_up.stdout + mariadb_compose_up.stderr) or
    'Started' in (mariadb_compose_up.stdout + mariadb_compose_up.stderr) or
    'Pulling' in (mariadb_compose_up.stdout + mariadb_compose_up.stderr)

- name: Restart MariaDB when server config changes
  ansible.builtin.command:
    cmd: docker compose -f {{ mariadb_compose_dir }}/compose.yml restart mariadb
  register: mariadb_compose_restart
  changed_when: "'Restarting' in (mariadb_compose_restart.stdout + mariadb_compose_restart.stderr)"
  when:
    - mariadb_server_config.changed
    - not mariadb_compose_up.changed

- name: Wait for MariaDB health check
  ansible.builtin.command:
    cmd: >-
      docker inspect --format={% raw %}'{{ .State.Health.Status }}'{% endraw %}
      {{ mariadb_name }}
  register: mariadb_health
  changed_when: false
  retries: 20
  delay: 6
  until: mariadb_health.stdout == "healthy"

- name: Disable remote MariaDB root users
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ mariadb_compose_dir }}/compose.yml"
      - exec
      - -T
      - mariadb
      - sh
      - -c
      - >-
        mariadb -uroot -p"$(cat /run/secrets/mariadb_root_password)"
        -e "DELETE FROM mysql.global_priv
        WHERE User = 'root'
        AND Host NOT IN ('{{ mariadb_root_allowed_hosts | join("','") }}');
        FLUSH PRIVILEGES;"
  changed_when: false
  no_log: true
