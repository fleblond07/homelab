---
mariadb_name: homelab-mariadb
mariadb_image: mariadb:11.4.12
mariadb_restart_policy: unless-stopped

mariadb_storage_root: /srv/homelab
mariadb_compose_dir: "{{ mariadb_storage_root }}/compose/mariadb"
mariadb_config_dir: "{{ mariadb_storage_root }}/config/mariadb"
mariadb_data_dir: "{{ mariadb_storage_root }}/data/mariadb"
mariadb_log_dir: "{{ mariadb_storage_root }}/logs/mariadb"
mariadb_secret_dir: "{{ mariadb_storage_root }}/secrets/mariadb"
mariadb_root_password_file: "{{ mariadb_secret_dir }}/root-password"

mariadb_uid: "999"
mariadb_gid: "999"

mariadb_timezone: "{{ timezone | default('UTC') }}"
mariadb_root_allowed_hosts:
  - localhost
  - 127.0.0.1
  - ::1

mariadb_character_set_server: utf8mb4
mariadb_collation_server: utf8mb4_unicode_ci

mariadb_memory_limit: 1g
mariadb_innodb_buffer_pool_size: 512M
mariadb_innodb_log_file_size: 128M
mariadb_max_connections: 50
mariadb_table_open_cache: 400

mariadb_slow_query_log_enabled: true
mariadb_slow_query_time: 2
mariadb_slow_query_log_file: /var/log/mysql/mariadb-slow.log
mariadb_logrotate_retention: 14

mariadb_healthcheck_interval: 30s
mariadb_healthcheck_timeout: 5s
mariadb_healthcheck_retries: 5
mariadb_healthcheck_start_period: 30s
