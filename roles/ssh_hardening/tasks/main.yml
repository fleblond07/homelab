---
- name: Build SSH LAN allow list
  ansible.builtin.set_fact:
    ssh_hardening_allow_users_entries: >-
      {{ ssh_hardening_allow_users_entries | default([]) + [item.0 ~ '@' ~ item.1] }}
  loop: "{{ ssh_hardening_allowed_users | product(ssh_hardening_lan_cidrs) | list }}"

- name: Configure SSH hardening
  ansible.builtin.template:
    src: 99-z-homelab-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart sshd for hardening

- name: Validate active sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Read effective SSH configuration
  ansible.builtin.command: sshd -T
  register: ssh_hardening_effective_config
  changed_when: false
  when: not ansible_check_mode

- name: Verify effective SSH authentication restrictions
  ansible.builtin.assert:
    that:
      - "'passwordauthentication ' ~ ssh_hardening_password_authentication in ssh_hardening_effective_config.stdout_lines"
      - "'permitrootlogin ' ~ ssh_hardening_permit_root_login in ssh_hardening_effective_config.stdout_lines"
      - "'kbdinteractiveauthentication ' ~ ssh_hardening_kbd_interactive_authentication in ssh_hardening_effective_config.stdout_lines"
    fail_msg: "An earlier SSH configuration overrides homelab hardening. Inspect sshd -T before restarting SSH."
  when: not ansible_check_mode
